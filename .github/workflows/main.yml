name: Build SecureDroid APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout SecureDroid
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build web application
        run: npm run build

      - name: Rebuild Android Project
        run: |
          # 1. Save our custom Kotlin files safely
          mkdir -p /tmp/my_plugin
          cp android/app/src/main/java/org/securedroid/app/*.kt /tmp/my_plugin/
          
          # 2. Delete the broken folder
          rm -rf android
          
          # 3. Let Capacitor generate the REAL Android project with gradlew
          npx cap add android
          
          # 4. Remove the default Java file Capacitor makes
          rm -f android/app/src/main/java/org/securedroid/app/MainActivity.java
          
          # 5. Put our custom Kotlin files back where they belong
          cp /tmp/my_plugin/*.kt android/app/src/main/java/org/securedroid/app/

      - name: Synchronize Android project
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Build APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SecureDroid-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
