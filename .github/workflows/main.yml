# trigger build
name: Build SecureDroid APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout SecureDroid
        uses: actions/checkout@v5   # Updated from v4 to v5

      - name: Setup Node.js
        uses: actions/setup-node@v5  # Updated from v4 to v5
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4  # Or use v5 if preferred
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Dependencies & Build Web Assets
        run: |
          npm ci
          npm run build
          npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SecureDroid-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
# trigger build
